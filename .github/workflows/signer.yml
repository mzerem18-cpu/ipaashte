name: Premium Cloud Signer Engine (Ultra Fast)

on:
  repository_dispatch:
    types: [trigger-sign]

jobs:
  build_and_sign:
    runs-on: ubuntu-latest
    steps:
      - name: ⚡ Fast Checkout
        uses: actions/checkout@v4
        with:
          show-progress: false
          fetch-depth: 1
          sparse-checkout: |
            cert/

      - name: 🚀 Ultra Fast Production Sign
        env:
          APP_NAME: ${{ github.event.client_payload.app_name }}
          USE_FREE_CERT: ${{ github.event.client_payload.use_free_cert }}
          CERT_FOLDER: ${{ github.event.client_payload.cert_folder }}
          P12_BASE64: ${{ github.event.client_payload.p12_base64 }}
          PROV_BASE64: ${{ github.event.client_payload.prov_base64 }}
          CUSTOM_PASSWORD: ${{ github.event.client_payload.password }}
          BUILD_ID: ${{ github.event.client_payload.build_id }}
          IPA_LINK: ${{ github.event.client_payload.ipa_link }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }} 
        run: |
          set -euo pipefail
          
          # جێگیرکردنی ناوی فۆڵدەر ئەگەر بەتاڵ بوو
          CERT_FOLDER="${CERT_FOLDER:-aramco}"

          # 1. تخطي حماية الشهادات
          cat << 'EOF' > /tmp/custom_openssl.cnf
          openssl_conf = openssl_init
          [openssl_init]
          providers = provider_sect
          [provider_sect]
          default = default_sect
          legacy = legacy_sect
          [default_sect]
          activate = 1
          [legacy_sect]
          activate = 1
          EOF
          export OPENSSL_CONF=/tmp/custom_openssl.cnf

          # 2. تنفيذ المهام بالتوازي (داگرتنی فایلەکە لە لینکە داینامیکییەکەوە)
          (
            wget -qO- https://github.com/zhlynn/zsign/releases/download/v1.0.4/zsign-linux-x86_64.tar.gz | tar -xz
            chmod +x zsign
          ) &
          
          (
            # بەکارهێنانی curl -L بۆ ئەوەی فایلی ڕاستەقینە بهێنێت تەنانەت ئەگەر لینکەکەش گۆڕدرابێت
            echo "Downloading IPA from: $IPA_LINK"
            curl -L -o raw_app.ipa "$IPA_LINK"
            
            # پشکنینی قەبارەی فایلەکە (بۆ ئەوەی لە لۆگەکان بزانیت بە باشی دابەزیوە یان نا)
            echo "Downloaded File Size:"
            ls -lh raw_app.ipa
          ) &
          
          (
            if [[ "$USE_FREE_CERT" == "true" ]]; then
              cp "$GITHUB_WORKSPACE/cert/$CERT_FOLDER/cert.p12" ./cert.p12
              cp "$GITHUB_WORKSPACE/cert/$CERT_FOLDER/profile.mobileprovision" ./profile.mobileprovision
            else
              echo "$P12_BASE64" | tr -d ' \n\r' | base64 -d > cert.p12
              echo "$PROV_BASE64" | tr -d ' \n\r' | base64 -d > profile.mobileprovision
            fi
          ) &
          
          wait

          # استخراج كلمة المرور
          if [[ "$USE_FREE_CERT" == "true" ]]; then 
            CERT_PASSWORD=$(cat "$GITHUB_WORKSPACE/cert/$CERT_FOLDER/pass.txt" | tr -d '\n\r')
          else 
            CERT_PASSWORD=$(echo "$CUSTOM_PASSWORD" | tr -d '\n\r')
          fi

          # 3. الحقن السريع جداً (مع إيقاف pipefail مؤقتاً لتجنب خطأ Broken pipe)
          set +o pipefail
          APP_DIR=$(unzip -Z1 raw_app.ipa | grep -o -E '^Payload/[^/]+\.app/' | head -n 1)
          set -o pipefail
          
          unzip -qq raw_app.ipa "${APP_DIR}Info.plist"

          # 4. بايثون محسّن ولحظي (مع توليد Bundle ID عشوائي)
          python3 -c '
          import plistlib, sys, os, random, string
          app_name, app_dir = sys.argv[1], sys.argv[2]
          plist_path = f"{app_dir}Info.plist"
          
          # دروستکردنی ٥ پیتی هەڕەمەکی بۆ ئەوەی هەر جارێک ئایدییەکە جیاواز بێت
          random_str = "".join(random.choices(string.ascii_lowercase, k=5))
          
          safe_app_name = app_name.replace(" ", "").lower()
          new_bundle_id = f"com.ashtemobile.{safe_app_name}.{random_str}"
          
          try:
              with open(plist_path, "rb") as f: pl = plistlib.load(f)
              pl["CFBundleIdentifier"] = new_bundle_id
              with open(plist_path, "wb") as f: plistlib.dump(pl, f)
              print(new_bundle_id)
          except:
              print(new_bundle_id)
          ' "$APP_NAME" "$APP_DIR" > bundle_id.txt

          # خستنە ناوەوەی بڕوانامەکان بۆ ئەو ئەپانەی کە پێویستیان پێیەتی (وەک ESign)
          if [[ "$APP_NAME" == "Feather" || "$APP_NAME" == "KSign" || "$APP_NAME" == "Ksign" || "$APP_NAME" == "ESign" || "$APP_NAME" == "Esign" ]]; then
            mkdir -p "${APP_DIR}signing-assets/PremiumCert"
            cp cert.p12 "${APP_DIR}signing-assets/PremiumCert/cert.p12"
            cp profile.mobileprovision "${APP_DIR}signing-assets/PremiumCert/cert.mobileprovision"
            echo "$CERT_PASSWORD" > "${APP_DIR}signing-assets/PremiumCert/cert.txt"
          fi

          # 5. التجميع السريع (Compression 0) والتوقيع
          zip -q0ur raw_app.ipa Payload
          ./zsign -q -k cert.p12 -p "$CERT_PASSWORD" -m profile.mobileprovision -o "${APP_NAME}_signed.ipa" raw_app.ipa

          # 6. الرفع النهائي (بەرزکردنەوەی بۆ بەکارهێنەر)
          gh release create "build-${BUILD_ID}" "${APP_NAME}_signed.ipa" "bundle_id.txt" -t "Cloud Build ${BUILD_ID}" -R ${{ github.repository }}
